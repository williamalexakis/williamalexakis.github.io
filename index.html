<button class="theme-toggle" type="button" aria-label="Switch between light and dark theme">
  <svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14">
    <path class="icon-sun" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM8 0v2M8 14v2M0 8h2M14 8h2M2.3 2.3l1.4 1.4M12.3 12.3l1.4 1.4M13.7 2.3l-1.4 1.4M3.7 12.3l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
    <path class="icon-moon" d="M13.5 9.7A6 6 0 0 1 6.3 2.5 6 6 0 1 0 13.5 9.7z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
  </svg>
</button>

<script>
document.querySelector(".theme-toggle").addEventListener("click", function () {
  var root = document.documentElement
  var explicit = root.getAttribute("data-theme")
  var isDark = explicit ? explicit === "dark"
                        : matchMedia("(prefers-color-scheme: dark)").matches
  var next = isDark ? "light" : "dark"
  root.setAttribute("data-theme", next)
  try { localStorage.setItem("theme", next) } catch (e) {}
})
</script>
